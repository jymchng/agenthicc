name: Weekly performance profile

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: performance-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly:
    name: 10k-session performance profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install worktree command sandbox
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv tool install nox
      - name: Run weekly probes
        run: nox -s perf_weekly
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-weekly-${{ github.run_id }}
          path: .nox/perf-weekly-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Classify weekly budget regression
        id: regression
        if: failure()
        run: |
          if [[ -f .nox/perf-weekly-report.json ]] && python3 -c 'import json, pathlib, sys; report=json.loads(pathlib.Path(".nox/perf-weekly-report.json").read_text()); sys.exit(0 if report.get("budget_violations") else 1)'; then
            echo "budget_regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "budget_regression=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update regression issue
        if: failure() && steps.regression.outputs.budget_regression == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- perf-weekly-budget-regression -->";
            const title = "[Performance] Weekly budget regression";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n\nThe scheduled 10k-session performance profile failed.\n\nRun: ${runUrl}\n\nDownload the performance-weekly-${context.runId} artifact for measurements and raw profiles.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
