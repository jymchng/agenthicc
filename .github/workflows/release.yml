name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Every gate, run again for the tagged commit: a tag on a red commit cannot
  # publish because every later job needs this one.
  # --------------------------------------------------------------------------
  ci:
    name: CI for the tagged commit
    uses: ./.github/workflows/ci.yml

  # --------------------------------------------------------------------------
  # Build — the tag must name the package version, and the built wheel must
  # report that version from `agenthicc --version`.
  # --------------------------------------------------------------------------
  build:
    name: Build distribution
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"

      - name: Install nox
        run: uv tool install nox==2026.7.11

      - name: Check the tag names the package version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the project version ${version}"
            exit 1
          fi

      - name: Build wheel and sdist
        run: nox -s build

      - name: Check distributions
        run: nox -s build_check

      - name: Check the wheel reports its own version
        run: |
          uv venv "${RUNNER_TEMP}/wheel-check"
          uv pip install --python "${RUNNER_TEMP}/wheel-check" dist/*.whl
          expected="agenthicc ${GITHUB_REF_NAME#v}"
          actual="$("${RUNNER_TEMP}/wheel-check/bin/agenthicc" --version)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the wheel reports '${actual}', expected '${expected}'"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  # --------------------------------------------------------------------------
  # Publish to TestPyPI — runs automatically on every green tag
  # --------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: testpypi
    permissions:
      id-token: write  # OIDC trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # --------------------------------------------------------------------------
  # Publish to PyPI — requires manual approval via environment protection rule
  # --------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [publish-testpypi]
    environment: pypi
    permissions:
      contents: write  # create the GitHub Release
      id-token: write  # OIDC trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: true
