name: CI

# Every gate of the repository runs here. Branch protection requires only the
# final "Required checks" job, which fails unless every other job succeeded,
# and the release workflow calls this workflow for the tagged commit.
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
    # labeled/unlabeled re-run the ratchets when an explicit type-baseline or
    # performance-budget approval label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s typecheck
      - run: nox -s typecheck_contracts

  type-audit:
    name: Type-safety ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # --baseline-ref compares against the target branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - name: Check the baseline (it may only decrease)
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'type-baseline-increase')
        run: nox -s type_audit -- --baseline-ref "origin/${{ github.base_ref }}"
      - name: Check the baseline (owner-approved increase or branch push)
        if: >-
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'type-baseline-increase')
        run: nox -s type_audit

  llms:
    name: llms-full.txt symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s llms_check

  docs:
    name: Docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s docs

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install worktree command sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap_path="$(command -v bwrap)"
          sudo chmod u+s "$bwrap_path"
          bwrap --unshare-user --ro-bind / / true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - name: Check performance-budget approval label
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          INCREASE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-budget-increase') }}
        run: |
          baseline="${RUNNER_TEMP}/performance-budgets.base.json"
          if git cat-file -e "${BASE_REF}:docs/reference/performance-budgets.json" 2>/dev/null; then
            git show "${BASE_REF}:docs/reference/performance-budgets.json" > "${baseline}"
          else
            printf '%s\n' '{"version":1,"metrics":{}}' > "${baseline}"
          fi
          args=(--baseline "${baseline}")
          if [[ "${INCREASE_APPROVED}" == "true" ]]; then
            args+=(--increase-approved)
          fi
          PYTHONPATH=src python scripts/check_performance_budget_policy.py "${args[@]}"
      - run: nox -s perf

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install worktree command sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap_path="$(command -v bwrap)"
          sudo chmod u+s "$bwrap_path"
          bwrap --unshare-user --ro-bind / / true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s "tests_unit-${{ matrix.python-version }}" -- -q

  integration:
    name: Integration tests and cassette replay (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install worktree command sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap_path="$(command -v bwrap)"
          sudo chmod u+s "$bwrap_path"
          bwrap --unshare-user --ro-bind / / true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s "tests_integration-${{ matrix.python-version }}" -- -q

  e2e:
    name: E2E and performance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install worktree command sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap_path="$(command -v bwrap)"
          sudo chmod u+s "$bwrap_path"
          bwrap --unshare-user --ro-bind / / true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s tests_e2e -- -q
      - run: nox -s tests_performance -- -q

  windows:
    name: Windows lock, filesystem and terminal tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s tests_windows -- -q

  coverage:
    name: Coverage (branch and subprocess)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install worktree command sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap_path="$(command -v bwrap)"
          sudo chmod u+s "$bwrap_path"
          bwrap --unshare-user --ro-bind / / true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: false
          version: "0.12.4"
      - run: uv tool install nox==2026.7.11
      - run: nox -s coverage -- -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        continue-on-error: true
        with:
          files: coverage.xml
          flags: unittests
          name: agenthicc
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  required:
    name: Required checks
    if: always()
    needs: [lint, typecheck, type-audit, llms, docs, perf, unit, integration, e2e, windows, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gate succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          EOF
