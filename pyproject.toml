[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthicc"
version = "0.1.0"
description = "State-driven agent operating system for autonomous software engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PRD-169 requires the canonical transaction-safe tool exchange API.
    "lauren-ai[anthropic,openai,ollama,litellm]>=1.6.1,<2",
    "anyio>=4.0",
    "typing-extensions>=4.11",
    "rich>=13.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
cloud = ["keyring>=25.0"]
book = ["Pillow>=10"]
cloakbrowser = ["cloakbrowser==0.5.3"]
playwright = ["playwright>=1.52,<2"]
mcp = [
    "lauren-ai[mcp]>=1.6.1,<2",
    "lauren-mcp[http,ws]>=1.1.0,<2",
]
# The one development set: every tool a Nox session or CI job calls.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.100",
    "pyte>=0.8",
    "agenthicc[book]",  # the book builder and TUI screenshot tests render real images
    "keyring>=25.7.0",
    "mypy>=1.15,<2",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "ruff>=0.15.22",
    "nox>=2026.7.11",
    "twine>=6.1",
    # Docs site (mkdocs build in CI)
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.scripts]
agenthicc = "agenthicc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The built-in agent definitions are Markdown users can read and duplicate (AGX-09).
[tool.setuptools.package-data]
"agenthicc.agents" = ["builtin/*.md"]

# Keep the operator and authoring documentation available in installed
# distributions.  The runtime inspection tools read this tree through the
# distribution metadata, while source checkouts continue to use ``docs/``.
[tool.setuptools.data-files]
"share/agenthicc/docs" = [
    "docs/index.md",
    "docs/contributing.md",
    "docs/tui-architecture.md",
    # LLM-facing API documentation and the README are part of the inspectable
    # doc surface; in a checkout they resolve from the repository root instead.
    "llms.txt",
    "llms-full.txt",
    "README.md",
]
"share/agenthicc/docs/guides" = ["docs/guides/*.md"]
"share/agenthicc/docs/reference" = ["docs/reference/*.md", "docs/reference/*.json"]

# Develop against the local lauren-ai checkout (mirrors the runtime
# `uv run --index lauren-ai=file://../lauren-all/lauren-ai` workflow) so source
# edits to the framework take effect without rebuilding/publishing a wheel.
# [tool.uv.sources]
# lauren-ai = { path = "../lauren-all/lauren-ai", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: unit tests (fast, no external deps)",
    "integration: integration tests (real event processor)",
    "e2e: end-to-end tests (PTY, API clients)",
    "cloakbrowser: tests requiring the optional CloakBrowser extra",
    "playwright: tests requiring the optional Playwright extra",
]
timeout = 60

[tool.coverage.run]
source = ["agenthicc"]
branch = true
# Measure the CLI, worker and replay subprocesses the E2E suite starts.
patch = ["subprocess"]

[tool.coverage.report]
# A ratchet, not a target: `nox -s coverage` measured 82.1% of statements and
# branches together (85.2% / 72.2%) on 2026-10-22. Raise the floor as coverage
# grows; never lower it to make a change pass.
fail_under = 81.5
precision = 1

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["agenthicc"]
show_error_codes = true
pretty = false
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# These imports are optional platform/provider boundaries. Each module still
# has to expose a typed local adapter; this override only prevents an absent
# optional installation from turning the whole package into an import error.
[[tool.mypy.overrides]]
module = [
    "agenthicc.tools.fs.pyodide",
    "agenthicc.tools.fs.s3",
    "agenthicc.tools.mcp",
    "agenthicc.tools.outlook",
    "agenthicc.tools.outlook.*",
    # The bundled make_book reference is intentionally kept byte-for-byte
    # identical to the external example and is not runtime application code.
    "agenthicc.workflows.make_book.build_book",
]
ignore_missing_imports = true
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
# A verbatim, bundled upstream reference script: the compile-phase inspection
# tools expose its exact source, so it is never reformatted.
exclude = ["src/agenthicc/workflows/make_book/build_book.py"]

[tool.ruff.lint]
# PRD-250 gate: bugbear and async-safety rules are enforced, along with
# supervised tasks (RUF006) and noqa hygiene (RUF100).
extend-select = ["B", "ASYNC", "RUF006", "RUF100"]
extend-ignore = [
    "E501",
    # Public async APIs take a ``timeout`` argument by design: the value
    # crosses provider, tool and adapter boundaries where a caller cannot wrap
    # the call in asyncio.timeout() itself.
    "ASYNC109",
]
# BLE001 suppressions record reviewed reasons for broad excepts. BLE is the
# next family PRD-250 enables; RUF100 keeps those justifications until then.
external = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Tests may do blocking setup and assertion I/O inside async test functions.
"tests/**" = ["ASYNC"]
# cbreak_reader.py uses table-style one-liner key dispatch (if b == b"\x03":  return ...)
"src/agenthicc/tui/cbreak_reader.py" = ["E701"]
# This file is a verbatim, bundled upstream/reference script. Keep its source
# unchanged so the compile-phase inspection tools expose the exact reference.
"src/agenthicc/workflows/make_book/build_book.py" = ["F401", "F841"]
