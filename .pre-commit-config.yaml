# Local gates mirror CI exactly: every hook runs the project's own tool through
# `uv run`, so the versions and configuration are the ones CI uses.
#   uvx pre-commit install    # installs both the pre-commit and pre-push hooks
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        # Recorded provider cassettes are replay fixtures, not build output.
        exclude: ^tests/fixtures/[^/]+/cassette\.jsonl$
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy src/agenthicc
        entry: uv run mypy src/agenthicc
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      - id: type-audit
        name: type-safety ratchet
        entry: uv run python scripts/type_audit.py --check docs/reference/type-safety-baseline.json
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
      - id: unit-tests
        name: unit tests
        entry: uv run pytest tests/unit -q -x
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
